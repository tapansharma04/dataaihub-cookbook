name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  basic-rag:
    name: examples/rag/01-basic-rag
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/rag/01-basic-rag

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Compile sources
        run: uv run python -m compileall -q .

      - name: Smoke tests (no paid APIs)
        run: uv run pytest -q
        env:
          # Ensure tests never depend on a real key
          OPENAI_API_KEY: ""

